name: CI

# La red de seguridad, automática: en cada push y cada PR a main se corre lo
# mismo que exigimos antes de commitear. Como todo se construye por prompts, esto
# es lo que garantiza que un cambio no rompe lo que ya funcionaba sin que nadie
# tenga que acordarse de comprobarlo.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Y a mano, con el botón "Run workflow" de la pestaña Actions, sin tener que
  # inventarse un commit para relanzarlo.
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Un cuelgue no puede salir gratis: el 19/08 el paso de instalar el navegador
    # se quedó 102 minutos parado en apt (los espejos de Ubuntu no respondían) y
    # nadie se enteró hasta mirarlo a mano. Lo normal son 90 segundos, así que
    # con 20 minutos sobra para fallar rápido y volver a lanzarlo.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobación de tipos
        run: npx tsc --noEmit

      - name: Tests (invariantes del dominio)
        run: npm test

      # El build degrada sin Supabase (sirve el seed local), así que no necesita
      # secretos: verifica que la app compila y prerrenderiza de punta a punta.
      - name: Build
        run: npm run build

      # E2E del viaje de la demo: clic-a-clic del recorrido usuario, contra el
      # build de producción que dejó el paso anterior. Los navegadores de
      # Playwright no vienen en el runner: se instalan justo antes de usarse.
      - name: Instalar navegador de Playwright
        # --with-deps tira de apt, que es de donde vino el cuelgue: si vuelve a
        # pasar, que reviente aquí y con nombre y apellidos.
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: E2E (viaje de la demo)
        run: npm run e2e

      - name: Subir reporte HTML de E2E
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
